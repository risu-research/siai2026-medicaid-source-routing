name: Locate public MCNA member handbook PDF links
on:
  push:
    branches: ['post-audit-handbook-comparison-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect official public handbook pages
        run: python tools/inspect_mcna_handbook_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-handbook-page-sources
          path: results/handbook-investigation/
          if-no-files-found: warn
