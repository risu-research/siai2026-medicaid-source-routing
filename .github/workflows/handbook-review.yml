name: Inspect MCNA official member handbook PDFs
on:
  push:
    branches: ['post-audit-handbook-comparison-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text extractor
        run: python -m pip install 'pymupdf==1.26.4'
      - name: Download public versions and index relevant pages
        env:
          RISU_SAVE_REVIEW_PDFS: '1'
        run: python tools/review_mcna_handbooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-mcna-handbook-excerpts
          path: results/handbook-investigation/official-pdf-review/
          if-no-files-found: warn
