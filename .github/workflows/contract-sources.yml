name: Inspect official MCNA contract PDFs

on:
  push:
    branches:
      - 'mcna-amendment-source-reconstruction-*'
      - 'mcna-clause-history-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text extractor
        run: python -m pip install 'pymupdf==1.26.4'
      - name: Install OCR fallback for font-encoded source PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: Record PDF SHA-256 and candidate clause locations
        run: python tools/scan_mcna_contracts.py --only 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcna-contract-source-scan
          path: results/contracts/scan/
          if-no-files-found: warn
